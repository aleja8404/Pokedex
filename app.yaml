runtime: python39

handlers:
  - url: /assets
    static_dir: dist/pokedex-angular/assets
    http_headers:
      X-Content-Type-Options: "nosniff"

  - url: /(.+\.(js|css|ico|jpg|png|gif|ttf|eot|otf|woff|woff2|txt))$
    static_files: dist/pokedex-angular/\1
    upload: dist/pokedex-angular/(.+\.(js|css|ico|jpg|png|gif|ttf|eot|otf|woff|woff2|txt))$
    http_headers:
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'sha256-QmIi/LDJnOEYAO9CVS/+JVvnKMiVsY6fn0FVoHnkPfg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets.pokemon.com https://raw.githubusercontent.com https://pokeapi.co https://img.pokemondb.net; connect-src 'self' https://pokeapi.co https://beta.pokeapi.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"

  - url: /.*
    static_files: dist/pokedex-angular/index.html
    upload: dist/pokedex-angular/index.html
    http_headers:
      Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
      X-Content-Type-Options: "nosniff"
      X-Frame-Options: "DENY"
      X-XSS-Protection: "1; mode=block"
      Referrer-Policy: "strict-origin-when-cross-origin"
      Permissions-Policy: "camera=(), microphone=(), geolocation=(), payment=()"
      Content-Security-Policy: "default-src 'self'; script-src 'self' 'sha256-QmIi/LDJnOEYAO9CVS/+JVvnKMiVsY6fn0FVoHnkPfg='; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets.pokemon.com https://raw.githubusercontent.com https://pokeapi.co https://img.pokemondb.net; connect-src 'self' https://pokeapi.co https://beta.pokeapi.co; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self';"
